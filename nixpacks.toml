[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodePackages.pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @workspace/db run push 2>/dev/null || true",
  "pnpm --filter @workspace/web-admin run build"
]

[start]
cmd = "NODE_ENV=production node --import tsx/esm artifacts/api-server/src/index.ts"
