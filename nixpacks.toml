[phases.setup]
nixPkgs = ["nodejs_24", "nodePackages.pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/db run push 2>/dev/null || true"]

[start]
cmd = "NODE_ENV=production node --import tsx/esm artifacts/api-server/src/index.ts"
