[phases.setup]
nixPkgs = ["nodejs_22", "nodePackages.pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/web-admin run build"]

[start]
cmd = "pnpm --filter @workspace/db run push && NODE_ENV=production node --import tsx/esm artifacts/api-server/src/index.ts"
